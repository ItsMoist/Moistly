name: Account security regressions
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - name: Test verifier and guard
        run: forge test --contracts test/account-security --use 0.8.30 --via-ir --no-match-contract CoinbaseValidatorForkTest
      - name: Test Coinbase wallet signature validation on Ethereum
        run: forge test --contracts test/account-security --use 0.8.30 --via-ir --match-contract CoinbaseValidatorForkTest --fork-url https://eth.drpc.org --fork-block-number 26510967
