[profile.default]
src = "contracts"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./"}]

[rpc_endpoints]
elysium = "https://rpc.elysium.kinetiq.xyz"
elysium_testnet = "https://testnet-rpc.elysium.kinetiq.xyz"
